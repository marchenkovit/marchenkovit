title: "Vitalii Marchenko · DevOps / SRE"
description: "Site Reliability Engineer · 11+ years · 100,000+ VPS · 10,000+ dedicated servers · 99.9%+ uptime · multi-region AWS"
# No Jekyll theme — all CSS inlined via _includes/critical-css.html (zero render-blocking).
show_downloads: false
github:
  is_project_page: true
  repository_url: https://github.com/marchenkovit/marchenkovit
  repository_nwo: marchenkovit/marchenkovit
  owner_url: https://github.com/marchenkovit
  owner_name: "Vitalii Marchenko"
plugins:
  - jekyll-relative-links
  - jekyll-commonmark-ghpages
  - jekyll-sitemap
  - jekyll-seo-tag

url: "https://marchenko.work"
permalink: /:path/

# jekyll-seo-tag emits twitter:card itself and defaults to "summary" (small
# thumbnail). Setting it here makes it emit the large-image card instead —
# defining a second tag by hand does not work, since the first one in the
# document wins.
twitter:
  card: summary_large_image

# Privacy-friendly analytics (no cookies, no consent banner needed).
# Dormant until filled in: sign up at https://www.goatcounter.com, then put your
# subdomain here (e.g. "marchenko" for marchenko.goatcounter.com). Empty = no
# script is emitted at all, so the page stays free of third-party requests.
goatcounter_code: ""

defaults:
  # Hand it to jekyll-seo-tag rather than writing og:image by hand: the plugin
  # only upgrades twitter:card to summary_large_image when it knows about an
  # image, and it emits og:image / twitter:image itself from this value.
  - scope:
      path: ""
    values:
      image: /assets/og-image.png
  - scope:
      path: "assets/certs"
    values:
      sitemap: false
  - scope:
      path: "assets/CV_Vitalii_Marchenko.pdf"
    values:
      sitemap: false
relative_links:
  enabled: true
  collections: true

markdown: CommonMarkGhPages
commonmark:
  options:
    - UNSAFE
    - SMART
    - GFM_QUIRKS
  extensions:
    - strikethrough
    - autolink
    - table
    - tagfilter
    - tasklist
exclude:
  - LICENSE
  - NOTICE
  - SECURITY.md
  - CODEOWNERS
  - .github
