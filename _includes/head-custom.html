<!-- Floating Table of Contents (auto-built from h2 headings, styles in critical-css.html) -->
<script>
(function () {
  var idle = window.requestIdleCallback || function (cb) { return setTimeout(cb, 250); };
  function buildToc() {
    var content = document.getElementById('content');
    if (!content) return;
    var headings = content.querySelectorAll('h2');
    if (headings.length < 3) return;
    var toc = document.createElement('nav');
    toc.id = 'page-toc';
    toc.setAttribute('aria-label', 'Table of contents');
    toc.innerHTML = '<strong>On this page</strong><ul></ul>';
    var ul = toc.querySelector('ul');
    var frag = document.createDocumentFragment();
    headings.forEach(function (h, i) {
      if (!h.id) {
        h.id = 'sec-' + (h.textContent.toLowerCase().replace(/[^\w]+/g, '-').replace(/^-|-$/g, '') || i);
      }
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent.replace(/^[\s\W_]+/, '').trim();
      li.appendChild(a);
      frag.appendChild(li);
    });
    // Dedicated CV download entry — always last, independent of heading text (robust to renames)
    var cvLi = document.createElement('li');
    var cvA = document.createElement('a');
    cvA.href = '/assets/CV_Vitalii_Marchenko.pdf';
    cvA.setAttribute('download', '');
    cvA.textContent = '📄 Download CV';
    cvLi.appendChild(cvA);
    frag.appendChild(cvLi);
    ul.appendChild(frag);
    document.body.appendChild(toc);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { idle(buildToc, { timeout: 2000 }); });
  } else {
    idle(buildToc, { timeout: 2000 });
  }
})();
</script>
