version: 2

updates:
  # Workflow actions are pinned to commit SHAs (see .github/workflows/*.yml).
  # Dependabot bumps the SHA and rewrites the trailing "# vN" comment for us.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
